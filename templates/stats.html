{% extends "base.html" %} {% block title %}Stats - LoL Playtime Tracker{%
endblock %} {% block content %}
<section class="section">
  <h2>Playtime Stats</h2>

  <div class="stats-grid">
    <div class="stat-block">
      <p class="stat-label">Total imported matches</p>
      <p class="stat-value">{{ total_matches }}</p>
    </div>

    <div class="stat-block">
      <p class="stat-label">Total imported playtime</p>
      <p class="stat-value">{{ total_playtime }}</p>
    </div>

    <div class="stat-block">
      <p class="stat-label">Playtime in last 14 days</p>
      <p class="stat-value">{{ last_14_days_playtime }}</p>
    </div>
  </div>
</section>
{% endblock %}
