{% extends "base.html" %} {% block title %}Settings - LoL Playtime Tracker{%
endblock %} {% block content %}
<section class="section">
  <h2>Settings</h2>

  {% if success_message %}
  <p class="success-message">{{ success_message }}</p>
  {% endif %} {% if error_message %}
  <p class="error-message">{{ error_message }}</p>
  {% endif %}

  <form method="post">
    <label>
      Riot ID:
      <input type="text" name="riot_id" value="{{ settings.riot_id }}" />
    </label>

    <label>
      Tagline:
      <input type="text" name="tagline" value="{{ settings.tagline }}" />
    </label>

    <label>
      Region:
      <input type="text" name="region" value="{{ settings.region }}" />
    </label>

    <label>
      API Key:
      <input type="password" name="api_key" value="{{ settings.api_key }}" />
    </label>

    <button type="submit">Save settings</button>
  </form>

  <form action="/test-account" method="post" class="secondary-action">
    <button type="submit">Test Riot connection</button>
  </form>
</section>
{% endblock %}
